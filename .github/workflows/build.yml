
name: Build Nima AI Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate full source
        run: |
          set -e
          test -f Nima-AI-Suite-1.0.0-Upload.zip

          mkdir -p /tmp/nima-ai-suite

          python3 - <<'PY'
          import zipfile

          source = "Nima-AI-Suite-1.0.0-Upload.zip"
          destination = "/tmp/nima-ai-suite"

          with zipfile.ZipFile(source, "r") as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  if name.startswith("/") or ".." in name.split("/"):
                      raise RuntimeError("Unsafe ZIP path: " + name)
                  if name:
                      item.filename = name
                      z.extract(item, destination)
          PY

          SRC=/tmp/nima-ai-suite

          test -f "$SRC/app/src/main/java/com/nima/aisuite/MainActivity.java"
          test -f "$SRC/app/src/main/java/com/nima/aisuite/compiler/NimaCompiler.java"
          test -f "$SRC/app/src/main/java/com/nima/aisuite/compiler/NimaVM.java"
          test -f "$SRC/app/src/main/java/com/nima/aisuite/gguf/GgufInspector.java"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          rm -rf app docs
          cp -a "$SRC/app" .
          if [ -d "$SRC/docs" ]; then cp -a "$SRC/docs" .; fi
          cp "$SRC/build.gradle" .
          cp "$SRC/settings.gradle" .
          cp "$SRC/gradle.properties" .

          echo "Full Nima AI Suite source validated."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Switch to JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK build successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nima-AI-Suite-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
