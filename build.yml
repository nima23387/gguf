name: Build Nima AI Suite
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-22.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '8'}
   - uses: android-actions/setup-android@v3
   - name: Install SDK
     run: |
      yes | sdkmanager --licenses >/dev/null
      sdkmanager "platforms;android-28" "build-tools;28.0.3"
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '5.6.4'}
   - name: Unit tests
     run: gradle test --no-daemon
   - name: Build APK
     run: gradle assembleDebug --no-daemon
   - name: Verify artifact
     run: test -s app/build/outputs/apk/debug/app-debug.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Nima-AI-Suite-1.0.0-debug
      path: app/build/outputs/apk/debug/app-debug.apk
